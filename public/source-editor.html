<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>源工程动效编辑器</title>
  <link rel="stylesheet" href="/source-editor.css">
</head>
<body>
  <header>
    <div>
      <h1>源工程动效编辑器</h1>
      <p>先播放原工程动效，再点选画面组件、替换素材，确认后才渲染 MP4。</p>
    </div>
    <span id="status">正在加载工程…</span>
  </header>
  <main>
    <aside class="panel shots">
      <h2>镜头</h2>
      <div id="shots"></div>
    </aside>
    <section class="panel stage">
      <div id="stage">
        <iframe id="film" src="/project/index.html?editor=1" allow="autoplay"></iframe>
        <canvas id="hit"></canvas>
      </div>
      <div class="transport">
        <button id="play" type="button">播放</button>
        <input id="time" aria-label="预览时间" type="range" min="0" max="1" step="0.01" value="0">
        <span id="clock">00:00.00</span>
      </div>
      <div class="preview-options">
        <label for="quality">预览清晰度</label>
        <select id="quality"><option value="540">流畅 · 540p</option><option value="720" selected>标准 · 720p</option><option value="1080">高清 · 1080p</option></select>
        <span id="perf">已暂停 · 点击组件可编辑</span>
      </div>
      <p class="hint">播放时收起未选中的框线；点击画面自动暂停并选择组件。预览清晰度不影响 MP4 导出。</p>
    </section>
    <aside class="panel inspector">
      <h2>组件属性</h2>
      <div id="empty" class="hint">点击画面中的组件后，这里会显示组件 ID、类型和边界。</div>
      <div id="detail" hidden>
        <div class="field"><b id="cid"></b><span id="ctype"></span></div>
        <p id="replaceHint" class="hint"></p>
        <label>替换图片或视频 <input id="asset" type="file" accept="image/*,video/*"></label>
        <label>显示方式 <select id="fit"><option value="contain">完整显示</option><option value="cover">裁切填充</option></select></label>
        <button id="add" type="button">替换并实时预览</button>
        <button id="save" type="button">保存 edits.json</button>
        <button id="renderSource" type="button" class="primary">按源工程渲染 MP4</button>
        <a id="renderDownload" class="download" hidden>下载源工程 MP4</a>
      </div>
    </aside>
  </main>
  <script type="module" src="/source-editor.js"></script>
</body>
</html>
