<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>视频局部替换工具</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header><div><h1>视频局部替换工具</h1><p>先标记镜头和组件，再做局部预览，最后导出整片。</p></div><span id="status">准备就绪</span></header>
  <main>
    <section class="panel setup">
      <label>基础视频 <input id="baseFile" type="file" accept="video/*" /></label>
      <label>时间线（可选） <input id="timelineFile" type="file" accept="application/json,.json" /></label>
      <button id="loadDemo">载入示例时间线</button>
    </section>
    <section class="workspace">
      <aside class="panel shots"><h2>镜头索引</h2><div id="shotList" class="shot-list"><div class="hint">选择视频后，这里会显示镜头。</div></div></aside>
      <section class="panel editor">
        <div class="video-wrap" id="videoWrap"><video id="video" controls></video><canvas id="overlay"></canvas><div id="dragHint">在画面上拖动红框，标记要替换的组件</div></div>
        <div class="time-row"><input id="timeRange" type="range" min="0" max="1" step="0.01" value="0" /><span id="timeLabel">00:00.00 / 00:00.00</span></div>
        <div class="controls"><label>开始 <input id="start" type="number" min="0" step="0.01" value="0" /></label><label>结束 <input id="end" type="number" min="0.01" step="0.01" value="1" /></label><label>适配 <select id="fit"><option value="contain">完整显示</option><option value="cover">裁切填充</option></select></label></div>
        <div class="asset-row"><label>替换图片或视频 <input id="replacementFile" type="file" accept="image/*,video/*" /></label><button id="addEdit">加入替换</button></div>
        <div class="help">当前版本对成片 MP4 使用覆盖层替换。字幕、原声和其他画面保持不变。</div>
      </section>
      <aside class="panel edits"><h2>修改清单</h2><div id="editList" class="edit-list"><div class="hint">还没有替换项。</div></div><button id="savePlan">保存修改单</button><button id="preview" class="preview">局部预览当前镜头</button><button id="render" class="primary">导出整片</button><a id="previewDownload" class="download" hidden>下载局部预览</a><a id="download" class="download" hidden>下载导出视频</a></aside>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
